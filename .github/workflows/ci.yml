name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: 单元测试
        run: dotnet test src/T9Pane.Tests/T9Pane.Tests.csproj --nologo --configuration Release
